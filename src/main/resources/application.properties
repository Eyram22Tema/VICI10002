spring.application.name=jibble-attendance-integration
server.port=8080

# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jibble_attendance}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Beginner-friendly local development setting.
# For production, use a proper migration tool such as Flyway instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Jibble authentication
# ---------------------------------------------------------------------------
# Option A: current Jibble personal access token
jibble.personal-access-token=${JIBBLE_PERSONAL_ACCESS_TOKEN:}

# Option B: Client ID + Client Secret
jibble.client-id=${JIBBLE_CLIENT_ID:}
jibble.client-secret=${JIBBLE_CLIENT_SECRET:}

# Token endpoint used when Client ID + Client Secret are supplied
jibble.identity-url=${JIBBLE_IDENTITY_URL:https://identity.prod.jibble.io/connect/token}

# Raw time-entry service
jibble.time-tracking-base-url=${JIBBLE_TIME_TRACKING_BASE_URL:https://time-tracking.prod.jibble.io/v1}

# OData pagination
jibble.page-size=${JIBBLE_PAGE_SIZE:200}

# Organization/application timezone
jibble.zone-id=${JIBBLE_ZONE_ID:Africa/Accra}

# ---------------------------------------------------------------------------
# Automatic synchronization
# ---------------------------------------------------------------------------
# 300000 ms = every 5 minutes
jibble.sync.fixed-delay-ms=${JIBBLE_SYNC_FIXED_DELAY_MS:300000}
jibble.sync.initial-delay-ms=${JIBBLE_SYNC_INITIAL_DELAY_MS:15000}

# Every automatic run re-reads recent days so that edits made in Jibble
# are also copied into PostgreSQL.
jibble.sync.lookback-days=${JIBBLE_SYNC_LOOKBACK_DAYS:2}

management.endpoints.web.exposure.include=health,info
